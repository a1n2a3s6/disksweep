      <stop offset="0%" stop-color="#07080B" />
      <stop offset="55%" stop-color="#110E0C" />
      <stop offset="100%" stop-color="#180D0A" />
    </linearGradient>
    <radialGradient id="rustGlow" cx="80%" cy="50%" r="42%">
