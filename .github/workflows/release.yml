name: Build & Release DiskSweep Binaries

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: disksweep.exe
            asset: disksweep-windows-x64.exe
          - os: ubuntu-latest
            bin: disksweep
            asset: disksweep-linux-x64
          - os: macos-latest
            bin: disksweep
            asset: disksweep-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
