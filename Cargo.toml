[package]
name = "disksweep"
version = "1.0.0"
edition = "2021"
authors = ["Anas Alhelaly <https://github.com/a1n2a3s6>"]
description = "Blazing-fast cross-platform Rust CLI & interactive TUI developer disk cleaner"
license = "MIT"
readme = "README.md"
repository = "https://github.com/a1n2a3s6/disksweep"
keywords = ["cli", "tui", "disk-cleaner", "developer-tools", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "disksweep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
rayon = "1.10"
walkdir = "2.5"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
